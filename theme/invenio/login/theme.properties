# Login theme "invenio": the classic Keycloak login theme with a slate
# background, bordered inputs, an optional logo from the realm attribute
# logoUrl (template.ftl) and an ORCID icon on the ORCID sign-in button.
parent=keycloak
import=common/keycloak

# css/login.css is the parent's stylesheet, resolved through the parent theme.
# The image build replaces @THEME_VERSION@ with the release (Dockerfile), so
# each release has its own URL: Keycloak serves theme files with a 30-day
# cache lifetime under a path that changes only with Keycloak's version.
styles=css/login.css css/invenio.css?v=@THEME_VERSION@

# Icon of the identity provider with alias "orcid" (resources/img/orcid.svg).
kcLogoIdP-orcid=kc-icon-orcid
