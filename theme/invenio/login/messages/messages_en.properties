# Overrides of Keycloak's login messages. usernameOrEmail labels the email field
# of the magic-link sign-in page (login-username.ftl); the magic-link-authenticator
# keys label the magic link on the "Try another way" page.
usernameOrEmail=Email
magic-link-authenticator-display-name=Email link
magic-link-authenticator-help-text=Get a one-time sign-in link by email.

# Passkey button among the identity providers (login-username.ftl)
webauthn-doAuthenticate=Passkey
