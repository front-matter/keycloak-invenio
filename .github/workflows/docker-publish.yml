name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    # Releases: v<Keycloak version>.<revision>, e.g. v26.8.2.0 (README.md).
    tags:
      - "v*.*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: front-matter/keycloak-invenio

# Actions are pinned to commit SHAs (tags can be moved); the comment names the
# release. Update both together.
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A release tag must start with the Keycloak version the Dockerfile builds
      # on, so image 26.8.2.0 always contains Keycloak 26.8.2.
      - name: Check release tag against Keycloak version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          keycloak_version=$(sed -n 's/^ARG KEYCLOAK_VERSION=//p' Dockerfile)
          if [[ ! "$GITHUB_REF_NAME" =~ ^v${keycloak_version//./\\.}\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match v${keycloak_version}.<revision>"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=^v(\d+\.\d+\.\d+\.\d+)$,group=1
            type=match,pattern=^v(\d+\.\d+\.\d+)\.\d+$,group=1
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
